<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaFire Bypasser 🔥</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ MediaFire Bypasser</h1>
      <p class="subtitle">Tempel shortlink, dapetin link MediaFire langsung. No iklan, no drama 😎</p>
    </header>
    <main>
      <div class="input-group">
        <input id="urlInput" type="text" placeholder="https://sfl.gl/xxxxx atau shortlink lainnya..." />
        <button id="goBtn">Gaskeun 🚀</button>
      </div>
      <div id="status" class="status hidden"></div>
      <div id="result" class="result hidden">
        <label>Link MediaFire:</label>
        <div class="result-row">
          <input id="resultInput" type="text" readonly />
          <button id="copyBtn" title="Copy">📋</button>
        </div>
        <a id="openBtn" target="_blank" rel="noopener">Buka di tab baru ↗</a>
      </div>
    </main>
    <footer><p>GeminiXD © 2108 — built with 💀 &amp; Node.js</p></footer>
  </div>
  <script src="/script.js"></script>
</body>
</html>
